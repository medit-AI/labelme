---
auto_save: true
display_label_popup: true
with_image_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness_contrast: false
# UI language as a locale code (e.g. ja_JP); null follows the system locale.
language:
# Color theme: 'system' follows the OS appearance, or force 'light' / 'dark'.
color_theme: system
flags:
label_flags:
labels:
file_search:
sort_labels: true
validate_label:
# Regex restricting what can be typed into the label field, e.g. "^(1[0-9]|[2-4][0-9]|50)$"
# to allow only integers from 10 to 50. null disables the restriction.
label_pattern: "^(?:[1-9]|[12][0-9]|3[0-2]|[A-T])$"
shape_color:
  mode: by_label  # auto, uniform, by_label
  auto:
    shift: 0
  uniform:
    color: [0, 255, 0]
  by_label:
    colors:
      '1': [150, 5, 61]
      '10': [16, 0, 0]
      '11': [0, 136, 0]
      '12': [0, 0, 176]
      '13': [176, 0, 0]
      '14': [160, 0, 191]
      '15': [171, 191, 0]
      '16': [86, 0, 0]
      '17': [86, 0, 0]
      '18': [171, 191, 0]
      '19': [160, 0, 191]
      '2': [235, 255, 7]
      '20': [176, 0, 0]
      '21': [0, 0, 176]
      '22': [0, 136, 0]
      '23': [16, 0, 0]
      '24': [0, 166, 166]
      '25': [6, 230, 230]
      '26': [80, 50, 50]
      '27': [4, 200, 3]
      '28': [30, 20, 240]
      '29': [240, 10, 7]
      '3': [224, 5, 255]
      '30': [224, 5, 255]
      '31': [235, 255, 7]
      '32': [150, 5, 61]
      '4': [240, 10, 7]
      '5': [30, 20, 240]
      '6': [4, 200, 3]
      '7': [80, 50, 50]
      '8': [6, 230, 230]
      '9': [0, 166, 166]
      A: [255, 86, 83]
      B: [106, 96, 255]
      C: [80, 255, 79]
      D: [156, 126, 126]
      E: [82, 255, 255]
      F: [76, 242, 242]
      G: [92, 76, 76]
      H: [76, 212, 76]
      I: [76, 76, 252]
      J: [252, 76, 76]
      K: [252, 76, 76]
      L: [76, 76, 252]
      M: [76, 212, 76]
      N: [92, 76, 76]
      O: [76, 242, 242]
      P: [82, 255, 255]
      Q: [156, 126, 126]
      R: [80, 255, 79]
      S: [106, 96, 255]
      T: [255, 86, 83]

    fallback: [0, 255, 0]
shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 8
  show_labels: false
ai:
  default: Sam2 (balanced)
  suppress_existing_shape_matches: false
# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true
# label_dialog
show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false
# canvas
epsilon: 10.0
canvas:
  fill_drawing: true
  # None: do nothing
  # close: close polygon
  double_click: close
  # max undo depth (number of edits kept on the backup stack)
  num_backups: 10
  # allow annotation points to extend beyond the image boundary
  allow_out_of_bounds_points: false
  # show crosshair
  crosshair:
    polygon: false
    rectangle: true
    oriented_rectangle: false
    circle: false
    line: false
    point: false
    linestrip: false
    ai_points_to_shape: false
    ai_box_to_shape: true
shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to:
  delete_file: Ctrl+Delete
  open_next: [D, Ctrl+Shift+D]
  open_prev: [A, Ctrl+Shift+A]
  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F
  create_polygon: Ctrl+N
  create_rectangle: Ctrl+R
  create_oriented_rectangle:
  create_circle:
  create_line:
  create_point:
  create_linestrip:
  ai_points_to_shape: Ctrl+I
  ai_box_to_shape: Ctrl+B
  edit_shape: Ctrl+J
  delete_shape: Delete
  duplicate_shape: Ctrl+D
  copy_shape: Ctrl+C
  paste_shape: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]
  show_all_shapes:
  hide_all_shapes:
  toggle_all_shapes: T
